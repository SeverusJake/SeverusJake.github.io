<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyen The Thien Phuc — Portfolio</title>
  <meta name="description" content="Portfolio of Nguyen The Thien Phuc — Unity & Web Developer building AR, VR, games, and websites.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // Runs before paint: light theme and English are defaults; restore saved choices.
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      if (localStorage.getItem('lang') === 'vi') {
        document.documentElement.setAttribute('lang', 'vi');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob-layer" id="blob-layer">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
  </div>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top" aria-label="Phuc — home">
        <span class="logo-mark" aria-hidden="true">P</span>
        <span class="logo-text" id="logo-text">Phuc</span><span class="logo-dot" aria-hidden="true">.</span>
      </a>
      <nav class="nav" aria-label="Main">
        <ul class="nav-links" id="nav-links">
          <li><a href="#projects" data-i18n="nav.projects">Projects</a></li>
          <li><a href="#skills" data-i18n="nav.skills">Skills</a></li>
          <li><a href="#experience" data-i18n="nav.experience">Experience</a></li>
          <li><a href="#about" data-i18n="nav.about">About</a></li>
          <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="lang-btn" id="lang-toggle" type="button" aria-label="Chuyển sang tiếng Việt">
          <span data-lang="en">EN</span><span data-lang="vi">VI</span>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
          <span class="bars" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container hero-inner">
        <p class="eyebrow reveal" data-i18n="greeting">Hi, I'm</p>
        <h1 class="hero-name gradient-text reveal" id="hero-name">Nguyen The Thien Phuc</h1>
        <p class="hero-role reveal" id="hero-role"></p>
        <p class="hero-tagline reveal" id="hero-tagline"></p>
        <div class="hero-cta reveal">
          <a class="btn btn-primary" href="#projects" data-i18n="cta.work">View Work</a>
          <a class="btn btn-ghost" href="#contact" data-i18n="cta.contact">Contact</a>
          <a class="btn btn-ghost" id="cv-link" href="assets/resume.pdf" target="_blank" rel="noopener" data-i18n="cta.cv">Download CV</a>
        </div>
        <dl class="stats reveal" id="hero-stats"></dl>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">01</p>
          <h2 id="projects-title" data-i18n="sections.projects">Projects</h2>
        </header>
        <div class="filters reveal" id="project-filters" role="group" aria-labelledby="projects-title"></div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">02</p>
          <h2 id="skills-title" data-i18n="sections.skills">Skills</h2>
        </header>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section class="section" id="experience" aria-labelledby="experience-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">03</p>
          <h2 id="experience-title" data-i18n="sections.experience">Experience</h2>
        </header>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="section" id="about" aria-labelledby="about-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">04</p>
          <h2 id="about-title" data-i18n="sections.about">About</h2>
        </header>
        <div class="glass about-card reveal" id="about-text"></div>
      </div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <div class="glass contact-card reveal">
          <p class="section-kicker">05</p>
          <h2 id="contact-title" data-i18n="sections.contact">Let's work together</h2>
          <p class="contact-text" id="contact-text"></p>
          <form class="contact-form" id="contact-form" hidden novalidate>
            <div class="form-row">
              <label class="field">
                <span data-i18n="form.name">Name</span>
                <input name="name" type="text" autocomplete="name" required maxlength="100">
              </label>
              <label class="field">
                <span data-i18n="form.email">Email</span>
                <input name="email" type="email" autocomplete="email" required maxlength="200">
              </label>
            </div>
            <label class="field">
              <span data-i18n="form.message">Message</span>
              <textarea name="message" rows="5" required maxlength="5000"></textarea>
            </label>
            <!-- Honeypot: bots fill it, people never see it. -->
            <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="btn btn-primary" type="submit" data-i18n="form.send">Send message</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </section>

    <noscript>
      <section class="section">
        <div class="container glass about-card">
          <p>Nguyen The Thien Phuc — Unity &amp; Web Developer.</p>
          <p><a href="https://github.com/SeverusJake">github.com/SeverusJake</a></p>
        </div>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year">2026</span> Nguyen The Thien Phuc</p>
    </div>
  </footer>

  <a class="to-top" id="to-top" href="#top" aria-label="Back to top" data-i18n-aria="top">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></svg>
  </a>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
