<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyen The Thien Phuc — Portfolio</title>
  <meta name="description" content="Portfolio of Nguyen The Thien Phuc — Unity & Web Developer with an IT support background.">
  <script>
    // Runs before paint: light is default, dark only if the visitor chose it.
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top" id="logo">Phuc<span class="logo-dot">.</span></a>
      <nav class="nav" aria-label="Main">
        <ul class="nav-links" id="nav-links">
          <li><a href="#projects">Projects</a></li>
          <li><a href="#skills">Skills</a></li>
          <li><a href="#experience">Experience</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
          <span class="bars" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="container hero-inner">
        <p class="eyebrow reveal">Hi, I'm</p>
        <h1 class="hero-name gradient-text reveal" id="hero-name">Nguyen The Thien Phuc</h1>
        <p class="hero-role reveal" id="hero-role"></p>
        <p class="hero-tagline reveal" id="hero-tagline"></p>
        <div class="hero-cta reveal">
          <a class="btn btn-primary" href="#projects">View Work</a>
          <a class="btn btn-ghost" href="#contact">Contact</a>
          <a class="btn btn-ghost" id="cv-link" href="assets/resume.pdf" target="_blank" rel="noopener">Download CV</a>
        </div>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">01</p>
          <h2 id="projects-title">Projects</h2>
        </header>
        <div class="filters reveal" id="project-filters" role="group" aria-label="Filter projects"></div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">02</p>
          <h2 id="skills-title">Skills</h2>
        </header>
        <div class="skills-grid" id="skills-grid"></div>
      </div>
    </section>

    <section class="section" id="experience" aria-labelledby="experience-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">03</p>
          <h2 id="experience-title">Experience</h2>
        </header>
        <ol class="timeline" id="timeline"></ol>
      </div>
    </section>

    <section class="section" id="about" aria-labelledby="about-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="section-kicker">04</p>
          <h2 id="about-title">About</h2>
        </header>
        <div class="glass about-card reveal" id="about-text"></div>
      </div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <div class="glass contact-card reveal">
          <p class="section-kicker">05</p>
          <h2 id="contact-title">Let's work together</h2>
          <p class="contact-text" id="contact-text"></p>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </section>

    <noscript>
      <section class="section">
        <div class="container glass about-card">
          <p>Nguyen The Thien Phuc — Unity &amp; Web Developer.</p>
          <p><a href="https://github.com/SeverusJake">github.com/SeverusJake</a></p>
        </div>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year">2026</span> Nguyen The Thien Phuc</p>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
